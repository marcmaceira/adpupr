# Local Postgres for Payload CMS development.
# Production uses Neon Postgres through the Vercel Marketplace integration.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: adpupr
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:?Set LOCAL_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: adpupr
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adpupr -d adpupr"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
